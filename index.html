<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11월 일본 여행 가이드</title>
<meta name="description" content="2026년 11월 중·하순 3박 4일 일본 지역별 여행 일정 가이드 (규슈, 오키나와 본섬·미야코지마·이시가키지마, 도쿄, 삿포로)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍁</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem("jp-nov-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="#/" class="brand" aria-label="메인으로">
      <span class="brand-mark">11</span>
      <span class="brand-text"><b>November Japan</b><small>3박 4일 여행 가이드</small></span>
    </a>
    <div class="top-actions">
      <button class="btn ghost sync-btn" id="btnSync" data-state="idle">☁</button>
      <button class="btn soft" id="btnSummary">전체 일정 요약</button>
      <button class="btn ghost" id="btnReset">초기화</button>
      <button class="icon-btn" id="btnTheme" aria-label="다크 모드 전환" title="테마 전환">🌙</button>
    </div>
  </div>
</header>

<main id="app" class="wrap"></main>

<footer class="footer wrap">
  <p>정보 확인일 <span id="checkedAt"></span> · 영업시간·요금·운항은 바뀔 수 있으니 방문 전 공식 정보를 확인하세요.</p>
</footer>

<div class="layer hidden" id="layer" role="dialog" aria-modal="true" aria-labelledby="layerTitle">
  <div class="layer-card" id="layerCard">
    <div class="layer-head">
      <h3 id="layerTitle"></h3>
      <button class="icon-btn" id="layerClose" aria-label="닫기">✕</button>
    </div>
    <div class="layer-body" id="layerBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="memos.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
